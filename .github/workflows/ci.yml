name: CI

# 브랜치 push 와 PR 마다 테스트를 돌린다.
# (태그 push 는 branches 필터로 제외되며 release.yml 이 처리)
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 테스트 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 문서상 지원 하한(3.8)부터 최신까지 검증
        python-version: ['3.8', '3.11', '3.13']
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 문법 컴파일 체크
        run: python -m py_compile isilon_usage/*.py tools/*.py tests/*.py

      - name: CLI 동작 확인
        run: python -m isilon_usage --version

      - name: 단위/통합 테스트
        run: |
          python tests/test_scanner.py
          python tests/test_manager.py
          python tests/test_server.py

  lint:
    name: 린트 (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check isilon_usage/ tools/ tests/

  dashboard-js:
    name: 대시보드 JS 문법
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JS 추출 + node 문법 검사
        run: |
          python3 - <<'PY'
          import re
          html = open("isilon_usage/dashboard.html", encoding="utf-8").read()
          m = re.search(r"<script>(.*)</script>", html, re.S)
          open("dash.js", "w").write(m.group(1))
          PY
          node --check dash.js
