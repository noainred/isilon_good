name: Release

# v 로 시작하는 태그(예: v1.1.0)를 push 하거나, GitHub 웹 UI 에서 릴리즈를
# 발행하면 자동으로 릴리즈를 만들고 압축본(오프라인 tar.gz/zip + wheel)을 첨부한다.
# 릴리즈 노트는 CHANGELOG.md 의 해당 버전 섹션에서 추출한다.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write   # 릴리즈 생성/자산 업로드에 필요

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 태그/버전 결정
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 테스트 (릴리즈 게이트)
        run: |
          python tests/test_scanner.py
          python tests/test_manager.py
          python tests/test_server.py

      - name: 릴리즈 노트 추출
        run: |
          VER="${{ steps.meta.outputs.version }}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && (/^## \[/ || /^\[[^][]+\]: http/) { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "릴리즈 ${{ steps.meta.outputs.tag }}" > release_notes.md
          echo "----- 릴리즈 노트 -----"; cat release_notes.md

      - name: 배포 자산 빌드 (오프라인 압축본 + wheel)
        run: |
          python tools/make_release.py          # download/*.tar.gz, *.zip
          python -m pip install --quiet build
          python -m build --wheel               # dist/*.whl (pip 오프라인 설치용)

      - name: 릴리즈 생성/갱신 + 압축본 첨부
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="isilon_usage ${{ steps.meta.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md
          else
            gh release create "$TAG" --title "$TITLE" --notes-file release_notes.md
          fi
          gh release upload "$TAG" \
            download/isilon_usage-*.tar.gz \
            download/isilon_usage-*.zip \
            dist/*.whl \
            --clobber
