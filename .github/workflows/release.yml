name: Release

# v 로 시작하는 태그(예: v1.0.0)를 push 하면 자동으로 릴리즈를 만든다.
# 릴리즈 노트는 CHANGELOG.md 의 해당 버전 섹션에서 추출한다.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 릴리즈 생성에 필요

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 테스트 (릴리즈 게이트)
        run: |
          python tests/test_scanner.py
          python tests/test_manager.py
          python tests/test_server.py

      - name: 버전/릴리즈 노트 추출
        id: notes
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # CHANGELOG.md 에서 "## [<버전>]" 섹션만 추출
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && (/^## \[/ || /^\[[^][]+\]: http/) { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "이 릴리즈(${GITHUB_REF_NAME})에 대한 CHANGELOG 항목을 찾지 못했습니다." > release_notes.md
          fi
          echo "----- 추출된 릴리즈 노트 -----"
          cat release_notes.md

      - name: GitHub 릴리즈 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "릴리즈 $GITHUB_REF_NAME 가 이미 존재합니다 — 노트를 갱신합니다."
            gh release edit "$GITHUB_REF_NAME" \
              --title "isilon_usage ${{ steps.notes.outputs.version }}" \
              --notes-file release_notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "isilon_usage ${{ steps.notes.outputs.version }}" \
              --notes-file release_notes.md \
              --verify-tag
          fi
