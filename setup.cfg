[metadata]
name = isilon-usage
version = attr: isilon_usage.__version__
description = 초대용량 NAS(아이실론 등)의 디렉터리별 사용량을 메모리 최소로 조사하고 웹 대시보드로 보여주는 도구
long_description = file: README.md
long_description_content_type = text/markdown
author = noainred
url = https://github.com/noainred/isilon_good
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    License :: OSI Approved :: MIT License
    Operating System :: POSIX :: Linux
    Topic :: System :: Filesystems
    Topic :: System :: Monitoring

[options]
packages = isilon_usage
python_requires = >=3.6
include_package_data = True

[options.package_data]
isilon_usage = dashboard.html

[options.entry_points]
console_scripts =
    isilon-usage = isilon_usage.cli:main

[options.extras_require]
monitor =
    psutil>=5.9
